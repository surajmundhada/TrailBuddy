server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: trailbuddy-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/trailbuddy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      # Dev: keep existing schema/data across restarts.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
    
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
      
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            
  websocket:
    message-broker:
      enabled: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

# File Upload Configuration
file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
    image-max-size: 5242880 # 5MB
    video-max-size: 26214400 # 25MB

# External API Configuration
api:
  google:
    places:
      key: ${GOOGLE_PLACES_API_KEY:your_google_places_api_key}
      base-url: https://maps.googleapis.com/maps/api/place
    
  openai:
    key: ${OPENAI_API_KEY:your_openai_api_key}
    base-url: https://api.openai.com/v1
    model: gpt-3.5-turbo
    
  signzy:
    key: ${SIGNZY_API_KEY:your_signzy_api_key}
    base-url: https://preproduction.signzy.tech/api/v1
    
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:your_twilio_account_sid}
    auth-token: ${TWILIO_AUTH_TOKEN:your_twilio_auth_token}
    phone-number: ${TWILIO_PHONE_NUMBER:+1234567890}

# Subscription Configuration
subscription:
  plans:
    basic:
      name: "Basic"
      price: 0
      duration-days: 365
    pro:
      name: "Pro"
      price: 299
      duration-days: 30
      features: ["priority_booking", "premium_guides", "ai_trip_planner"]
    premium:
      name: "Premium"
      price: 499
      duration-days: 30
      features: ["priority_booking", "premium_guides", "ai_trip_planner", "dedicated_support", "exclusive_experiences"]

# Razorpay Configuration
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_XXXXXXXXXXXXXX}
    secret: ${RAZORPAY_KEY_SECRET:XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX}

# Platform Configuration
platform:
  commission:
    percentage: 15 # 15% platform commission
  safety:
    emergency:
      contact: ${EMERGENCY_CONTACT:+911122223333}
  support:
    email: ${SUPPORT_EMAIL:support@trailbuddy.com}
    phone: ${SUPPORT_PHONE:+918877665544}

# Logging Configuration
logging:
  level:
    com.trailbuddy: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/trailbuddy.log

# Management Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# DigiLocker Configuration (sandbox-ready; fill in your real values)
digilocker:
  client-id: ${DIGILOCKER_CLIENT_ID:demo_client_id}
  client-secret: ${DIGILOCKER_CLIENT_SECRET:demo_client_secret}
  redirect-uri: ${DIGILOCKER_REDIRECT_URI:http://localhost:8080/api/digilocker/callback}
  # Point to our internal fake DigiLocker provider so the full OAuth flow works locally.
  auth-url: ${DIGILOCKER_AUTH_URL:http://localhost:8080/api/fake-digilocker/authorize}
  token-url: ${DIGILOCKER_TOKEN_URL:http://localhost:8080/api/fake-digilocker/token}
  ekyc-url: ${DIGILOCKER_EKYC_URL:http://localhost:8080/api/fake-digilocker/ekyc}
