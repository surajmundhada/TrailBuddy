version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: trailbuddy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 2005
      MYSQL_DATABASE: trailbuddy
      MYSQL_USER: root
      MYSQL_PASSWORD: 2005
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - trailbuddy-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trailbuddy-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: trailbuddy
      DB_USERNAME: trailbuddy
      DB_PASSWORD: trailbuddy123
      JWT_SECRET: mySecretKey123456789012345678901234567890
      MAIL_HOST: smtp.mailtrap.io
      MAIL_PORT: 2525
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    volumes:
      - ./uploads:/app/uploads
    networks:
      - trailbuddy-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trailbuddy-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8080/api
      VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - trailbuddy-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: trailbuddy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trailbuddy-network

  # Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: trailbuddy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - trailbuddy-network
    profiles:
      - production

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  trailbuddy-network:
    driver: bridge
